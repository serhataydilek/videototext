name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Least privilege: the workflow only reads repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same workflow + ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  validate:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      # Uses the committed pnpm-lock.yaml; fails if it is out of sync.
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      # Mocked unit tests only; yt-dlp, FFmpeg and whisper.cpp are not required.
      - name: Run tests
        run: corepack pnpm test

      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit

      - name: Build CLI
        run: corepack pnpm run build:cli

      - name: Build web app
        run: corepack pnpm build
